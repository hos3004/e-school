; PHP-FPM للإنتاج.
;
; الملف التطويري يرفع التوازي إلى 12 عاملًا ديناميكيًا. هنا `static`: عدد ثابت
; لا يتذبذب تحت الحمل ولا يدفع تكلفة إنشاء العمال وقت الذروة.
;
; القياس على النسخة المرشّحة: صفحة إدارة Filament بين 128 و184 ميلي/ثانية،
; أي ~6.7 طلبة في الثانية للعامل الواحد. ستة عشر عاملًا تكفي ~100 طلبة/ثانية،
; وهو أضعاف ما يولّده خمسون مستخدمًا متزامنًا (≈5 طلبات/ثانية، وذروة ≈15).
;
; السقف الحقيقي هو الذاكرة: 16 × ~150MB ≈ 2.4GB من 11GB، والباقي لـPostgres
; وRedis وHorizon والنظام.

[www]
pm = static
pm.max_children = 16
pm.max_requests = 500

; تسريب ذاكرة في عامل واحد لا يجب أن يُسقط الخدمة.
pm.status_path = /fpm-status

request_terminate_timeout = 120s

; Request diagnostics, managed by the platform performance release.
include = /var/www/html/docker/php/fpm-observability.conf
