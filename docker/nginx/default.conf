# Timings exclude query strings, cookies, and request bodies.
log_format performance escape=json '{"method":"$request_method","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time","bytes":$body_bytes_sent}';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 256M;

    # تخزين نتائج فحص الملفات (stat) بعيدًا عن مسار NTFS/9p البطيء.
    # صالح لمدة دقيقتين فقط حتى لا يعطل التطوير الساخن للأصول الثابتة.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 1;
    open_file_cache_errors off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Only Vite assets with a content hash may be cached indefinitely.
    location ~* "^/build/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$" {
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        # $document_root بدل $realpath_root: realpath() عبر bind mount
        # (9p/virtiofs) يكلف استدعاءات metadata في كل طلب على Windows.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log performance;
}
